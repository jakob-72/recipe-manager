name: Check

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  check-backend:
    name: Check Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Run ktlint
        working-directory: recipe-manager-backend
        run: ./gradlew ktlintCheck

      - name: Build & Test
        working-directory: recipe-manager-backend
        run: ./gradlew build

  check-frontend:
    name: Check Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: recipe-manager-frontend
        run: npm install

      - name: Run ESLint
        working-directory: recipe-manager-frontend
        run: npm run lint

      - name: Run Tests
        working-directory: recipe-manager-frontend
        run: npm test

  scan-vulnerabilities:
    name: Scan Vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner in fs mode
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: 1
          format: table
